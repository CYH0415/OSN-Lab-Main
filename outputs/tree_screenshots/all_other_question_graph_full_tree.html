<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Other App Types Full Tree</title>
<style>
  :root {
    --accent: #7B3FE4;
    --ink: #1f2933;
    --muted: #657482;
    --line: #d8dee6;
    --panel: #ffffff;
    --bg: #f6f7f9;
  }
  * { box-sizing: border-box; }
  body {
    width: 2000px;
    height: 1400px;
    margin: 0;
    overflow: hidden;
    color: var(--ink);
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .page {
    width: 100%;
    height: 100%;
    padding: 34px 40px 38px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,252,0.98)),
      radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 35%);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    height: 118px;
  }
  h1 {
    margin: 0;
    font-size: 48px;
    line-height: 1;
    letter-spacing: 0;
  }
  .subtitle {
    margin-top: 12px;
    font-size: 21px;
    color: var(--muted);
    font-weight: 700;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 128px);
    gap: 10px;
  }
  .stat {
    height: 86px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255,255,255,0.88);
  }
  .stat strong {
    display: block;
    color: var(--accent);
    font-size: 32px;
    line-height: 1;
  }
  .stat span {
    display: block;
    margin-top: 7px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 800;
  }
  .tree-panel {
    height: 930px;
    padding: 20px 22px 16px;
    border: 2px solid color-mix(in srgb, var(--accent) 50%, #d8dee6);
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 18px 42px rgba(31, 41, 51, 0.08);
  }
  .label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 16px;
    font-weight: 800;
  }
  .legend {
    display: flex;
    gap: 16px;
  }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-right: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .legend span:nth-child(2)::before { background: #18A04D; }
  .legend span:nth-child(3)::before { background: #9AA8B6; }
  .branch-panel {
    height: 245px;
    margin-top: 22px;
    padding: 18px 22px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255,255,255,0.9);
  }
  .branch-title {
    margin-bottom: 10px;
    color: var(--ink);
    font-size: 18px;
    font-weight: 850;
  }
  svg text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
</style>
</head>
